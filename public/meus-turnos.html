<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meus turnos — Escala Solidária</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app">
  <main class="conteudo" style="padding-top:28px;gap:18px">
    <h1 class="titulo-tela">Meus turnos</h1>

    <section class="resumo-horas" aria-label="Resumo de horas">
      <div style="display:flex;flex-direction:column;gap:2px">
        <span class="rotulo-claro" id="ano-rotulo">Horas doadas</span>
        <span class="numero" id="horas">–</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
        <div style="display:flex;flex-direction:column"><b style="font-size:20px" id="n-turnos">–</b><span class="rotulo-claro" style="font-size:12px">turnos concluídos</span></div>
        <div style="display:flex;flex-direction:column"><b style="font-size:20px" id="n-ongs">–</b><span class="rotulo-claro" style="font-size:12px">ONGs ajudadas</span></div>
      </div>
      <a class="btn" href="/certificado.html">Ver certificado</a>
    </section>

    <div class="segmentado" role="tablist" aria-label="Filtrar turnos">
      <button type="button" role="tab" id="aba-prox" aria-selected="true">Próximos</button>
      <button type="button" role="tab" id="aba-hist" aria-selected="false">Histórico</button>
    </div>

    <div id="lista" aria-live="polite"><div class="carregando">Carregando…</div></div>
  </main>
  <div id="tabbar"></div>
</div>
<script src="/js/api.js"></script>
<script>
  let dados = { proximos: [], historico: [] };
  let aba = 'prox';
  document.querySelector('.resumo-horas .btn').innerHTML = `${ICONE.download} Ver certificado`;

  (async () => {
    await exigirLogin('voluntario');
    document.getElementById('tabbar').outerHTML = tabbar('meus');
    const [resumo, inscricoes] = await Promise.all([api('GET', '/api/me/resumo'), api('GET', '/api/me/inscricoes')]);
    document.getElementById('ano-rotulo').textContent = `Horas doadas em ${resumo.ano}`;
    document.getElementById('horas').textContent = fmtHoras(resumo.horas);
    document.getElementById('n-turnos').textContent = resumo.turnos;
    document.getElementById('n-ongs').textContent = resumo.ongs;
    dados = inscricoes;
    render();
  })();

  document.getElementById('aba-prox').onclick = () => { aba = 'prox'; render(); };
  document.getElementById('aba-hist').onclick = () => { aba = 'hist'; render(); };

  function render() {
    document.getElementById('aba-prox').setAttribute('aria-selected', String(aba === 'prox'));
    document.getElementById('aba-hist').setAttribute('aria-selected', String(aba === 'hist'));
    const lista = document.getElementById('lista');

    if (aba === 'prox') {
      if (!dados.proximos.length) {
        lista.innerHTML = '<div class="card vazio">Você ainda não tem turnos marcados.<br><a href="/turnos.html" style="font-weight:700">Encontrar um turno</a></div>';
        return;
      }
      lista.innerHTML = '<div style="display:flex;flex-direction:column;gap:12px">' + dados.proximos.map((t) => {
        const { dia, mes } = diaMes(t.data);
        const tag = t.status === 'confirmada' ? '<span class="tag tag-verde">Confirmado</span>' : '<span class="tag tag-laranja">Lista de espera</span>';
        return `<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px">
          <a href="/turno.html?id=${t.turno_id}" style="display:flex;gap:12px;align-items:flex-start;text-decoration:none;color:inherit">
            <div class="data-box"><b>${dia}</b><span>${mes}</span></div>
            <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
              <b style="font-size:16px;line-height:1.3">${esc(t.titulo)}</b>
              <span class="ajuda">${esc(t.ong_nome)} · ${fmtHora(t.hora_inicio)}–${fmtHora(t.hora_fim)}</span>
              <span style="margin-top:6px">${tag}</span>
            </div>
          </a>
          ${t.status === 'confirmada' ? `<a class="btn btn-contorno" style="height:44px" href="/checkin.html?inscricao=${t.id}">${ICONE.qr} QR de check-in</a>` : ''}
        </div>`;
      }).join('') + '</div>';
    } else {
      if (!dados.historico.length) {
        lista.innerHTML = '<div class="card vazio">Seus turnos concluídos aparecem aqui.</div>';
        return;
      }
      lista.innerHTML = '<div class="card">' + dados.historico.map((h) => `
        <div style="padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #EEF1F4">
          <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
            <b style="font-size:15px">${esc(h.titulo)}</b>
            <span class="ajuda">${esc(h.ong_nome)} · ${fmtDataCompleta(h.data)}</span>
          </div>
          ${h.presenca === 'presente'
            ? `<b style="color:var(--verde);flex:0 0 auto">+${fmtHoras(h.horas)}</b>`
            : '<span class="tag tag-cinza">Sem presença</span>'}
        </div>`).join('') + '</div>';
    }
  }
</script>
</body>
</html>
