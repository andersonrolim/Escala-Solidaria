<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Certificado de voluntariado — Escala Solidária</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="nao-imprimir" style="max-width:820px;margin:16px auto 0;padding:0 16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
  <a class="btn btn-secundario" href="/meus-turnos.html">← Voltar</a>
  <button class="btn btn-primario" onclick="window.print()">Imprimir / salvar em PDF</button>
</div>
<article class="certificado" id="cert"><div class="carregando">Carregando…</div></article>
<script src="/js/api.js"></script>
<script>
  (async () => {
    await exigirLogin('voluntario');
    const r = await api('GET', '/api/me/resumo');
    const hoje = new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
    document.getElementById('cert').innerHTML = `
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:40px">
        <div class="logo" style="width:44px;height:44px;border-radius:12px">${ICONE.logo}</div>
        <b style="font-size:18px">Escala Solidária</b>
      </div>
      <h1 style="font-size:32px;font-weight:800;margin-bottom:24px">Certificado de Voluntariado</h1>
      <p style="font-size:17px;line-height:1.7">Certificamos que <b>${esc(r.nome)}</b> realizou
        <b>${fmtHoras(r.horas)}</b> de trabalho voluntário em <b>${r.turnos}</b> ${r.turnos === 1 ? 'turno' : 'turnos'},
        junto a <b>${r.ongs}</b> ${r.ongs === 1 ? 'organização' : 'organizações'}, no ano de ${r.ano}.</p>
      ${r.detalhes.length ? `<table class="tabela" style="margin-top:32px">
        <thead><tr><th>Data</th><th>Atividade</th><th>Organização</th><th style="text-align:right">Horas</th></tr></thead>
        <tbody>${r.detalhes.map((d) => `<tr><td>${fmtDataCompleta(d.data)}</td><td>${esc(d.titulo)}</td><td>${esc(d.ong_nome)}</td><td style="text-align:right">${fmtHoras(d.horas)}</td></tr>`).join('')}</tbody>
      </table>` : '<p class="vazio">Nenhuma presença registrada neste ano ainda.</p>'}
      <p class="ajuda" style="margin-top:40px">Emitido em ${hoje}. As horas consideram apenas os turnos com presença confirmada pela ONG.</p>`;
  })();
</script>
</body>
</html>
