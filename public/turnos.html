<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turnos disponíveis — Escala Solidária</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app">
  <header class="topo">
    <div style="display:flex;flex-direction:column;gap:2px">
      <span style="font-size:14px;color:var(--muted)" id="ola">Olá!</span>
      <h1 class="titulo-tela">Turnos perto de você</h1>
    </div>
    <label class="busca" for="busca">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span class="sr-only">Buscar</span>
      <input id="busca" type="search" placeholder="Buscar por ONG, atividade ou bairro">
    </label>
    <div class="chips" id="chips" role="group" aria-label="Filtrar por categoria"></div>
  </header>

  <main class="conteudo" id="lista" aria-live="polite">
    <div class="carregando">Carregando turnos…</div>
  </main>

  <div id="tabbar"></div>
</div>
<script src="/js/api.js"></script>
<script>
  let categoria = 'Todos';
  let timer;

  (async () => {
    const usuario = await exigirLogin('voluntario');
    document.getElementById('ola').textContent = `Olá, ${usuario.nome.split(' ')[0]}`;
    document.getElementById('tabbar').outerHTML = tabbar('explorar');
    const { categorias } = await api('GET', '/api/turnos/categorias');
    montarChips(['Todos', ...categorias]);
    carregar();
  })();

  function montarChips(lista) {
    const el = document.getElementById('chips');
    el.innerHTML = lista.map((c) => `<button type="button" class="chip" aria-pressed="${c === categoria}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
    el.querySelectorAll('.chip').forEach((b) => b.addEventListener('click', () => {
      categoria = b.dataset.c;
      el.querySelectorAll('.chip').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      carregar();
    }));
  }

  document.getElementById('busca').addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(carregar, 300);
  });

  async function carregar() {
    const lista = document.getElementById('lista');
    const params = new URLSearchParams({ categoria, q: document.getElementById('busca').value });
    try {
      const { turnos } = await api('GET', `/api/turnos?${params}`);
      if (!turnos.length) {
        lista.innerHTML = '<div class="vazio">Nenhum turno encontrado com esses filtros.</div>';
        return;
      }
      lista.innerHTML = `<span style="font-size:13px;font-weight:600;color:var(--muted)">${turnos.length} ${turnos.length === 1 ? 'turno encontrado' : 'turnos encontrados'}</span>` +
        turnos.map(cartao).join('');
    } catch (err) {
      lista.innerHTML = `<div class="alerta alerta-erro">${esc(err.message)}</div>`;
    }
  }

  function cartao(t) {
    const pct = Math.round((t.ocupadas / t.vagas) * 100);
    let vagasTxt, vagasCor = 'var(--muted)';
    if (t.vagas_livres === 0) { vagasTxt = t.lista_espera ? 'Lotado · lista de espera aberta' : 'Lotado'; vagasCor = '#B4400A'; }
    else if (t.vagas_livres === 1) { vagasTxt = `Última vaga! 1 de ${t.vagas}`; vagasCor = '#B4400A'; }
    else vagasTxt = `${t.vagas_livres} vagas livres de ${t.vagas}`;
    const minha = t.minha_inscricao === 'confirmada' ? '<span class="tag tag-azul">Você está inscrito</span>'
      : t.minha_inscricao === 'espera' ? '<span class="tag tag-laranja">Na lista de espera</span>' : '';
    return `<a class="card turno-card" href="/turno.html?id=${t.id}">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="tag tag-verde">${esc(t.categoria)}</span>${minha}
      </div>
      <div style="display:flex;flex-direction:column;gap:2px">
        <span class="titulo">${esc(t.titulo)}</span>
        <span style="font-size:14px;color:var(--muted)">${esc(t.ong_nome)}</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <span class="linha-info">${ICONE.calendario}${fmtData(t.data)} · ${fmtHorario(t.hora_inicio, t.hora_fim)}</span>
        <span class="linha-info">${ICONE.local}${t.online ? 'Online (videochamada)' : esc(t.endereco)}</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div class="barra"><span style="width:${pct}%"></span></div>
        <span style="font-size:13px;font-weight:600;color:${vagasCor}">${vagasTxt}</span>
      </div>
    </a>`;
  }
</script>
</body>
</html>
